[tox]
envlist = lint,type,coverage

[testenv]
basepython = python3.12
setenv =
    VIRTUALENV_OVERRIDE_APP_DATA={toxinidir}/.tox/venv_app_data

[testenv:test]
description = Run unit test suite
skip_install = true
setenv =
    {[testenv]setenv}
    PYTHONPATH={toxinidir}/src
deps =
    pytest>=8
commands =
    pytest -q {posargs:tests}

[testenv:test-fast]
description = Run fast unit checks used by pre-commit
skip_install = true
setenv =
    {[testenv]setenv}
    PYTHONPATH={toxinidir}/src
deps =
    pytest>=8
commands =
    pytest -q -m "not e2e_github" {posargs:tests}

[testenv:coverage]
description = Run branch coverage and enforce threshold
setenv =
    {[testenv]setenv}
    COVERAGE_FILE={toxworkdir}/.coverage.{envname}
deps =
    pytest>=8
    pytest-cov>=6
commands =
    pytest -q -m "not e2e_github" --cov=marquee --cov-branch --cov-report=term-missing --cov-report=xml --cov-report=html {posargs:tests}

[testenv:coverage-fast]
description = Run fast coverage gate used by pre-commit
skip_install = true
setenv =
    {[testenv]setenv}
    PYTHONPATH={toxinidir}/src
    COVERAGE_FILE={toxworkdir}/.coverage.{envname}
deps =
    {[testenv:coverage]deps}
commands =
    pytest -q -m "not e2e_github" --cov=marquee --cov-branch --cov-report=term-missing {posargs:tests}

[testenv:lint]
description = Run lint checks
skip_install = true
deps =
    black>=24
    ruff>=0.15
commands =
    black --check src tests
    ruff check src tests

[testenv:format]
description = Auto-format Python code
skip_install = true
deps =
    black>=24
    ruff>=0.15
commands =
    black src tests
    ruff check src tests --fix

[testenv:type]
description = Run static typing checks
skip_install = true
deps =
    mypy>=1.10
commands =
    mypy src

[testenv:precommit]
description = Run full pre-commit tox suite
skip_install = true
allowlist_externals =
    git
setenv =
    {[testenv]setenv}
    PYTHONPATH={toxinidir}/src
deps =
    {[testenv:format]deps}
    {[testenv:lint]deps}
    {[testenv:type]deps}
    {[testenv:coverage-fast]deps}
commands =
    {[testenv:format]commands}
    {[testenv:lint]commands}
    {[testenv:type]commands}
    {[testenv:coverage-fast]commands}
    git diff --exit-code -- src tests
